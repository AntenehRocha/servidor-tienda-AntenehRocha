<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina de contacto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-light border-bottom">
        <div class="container">
          <a class="navbar-brand fw-bold" href="./../index.html"
            >Tienda Informatica</a
          >

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link active" href="./tienda.html">Tienda</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./contacto.html">Contacto</a>
              </li>
            </ul>
          </div>

          <button
            class="btn btn-outline-primary"
            data-bs-toggle="modal"
            data-bs-target="#RegModal"
            id="botonRegistroLogin"
          >
            Registrarse / Login
          </button>

          <div id="tipoUsuario"></div>
          <div id="bienvenidaHeader"></div>

          <button
            type="button"
            class="btn btn-outline-danger d-none"
            id="cerrarSesionBoton"
          >
            Cerrar sesion
          </button>
        </div>
      </nav>
    </header>

    <section class="contenedor-login">
      <div class="modal fade" id="RegModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Registrarse</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>

            <div class="modal-body">
              <ul class="nav nav-pills justify-content-center mb-4">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#"
                    >Registrarse</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link"
                    href="#"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                    >Iniciar Sesion</a
                  >
                </li>
              </ul>
              <div id="alertContainer"></div>
              <form id="regForm" novalidate>
                <div class="mb-3">
                  <label class="form-label">Usuario</label>
                  <input
                    type="text"
                    class="form-control"
                    name="usuario"
                    required
                    id="nombreInput"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    name="password"
                    required
                    id="contraseñaInput"
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100"
                  id="regButton"
                >
                  Crear cuenta
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Iniciar Sesión</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>

            <div class="modal-body">
              <ul class="nav nav-pills justify-content-center mb-4">
                <li class="nav-item">
                  <a
                    class="nav-link"
                    aria-current="page"
                    href="#"
                    data-bs-toggle="modal"
                    data-bs-target="#RegModal"
                    >Registrarse</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link active"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                    >Iniciar Sesion</a
                  >
                </li>
              </ul>
              <div id="alertContainerLogin"></div>
              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label class="form-label">Usuario</label>
                  <input
                    type="text"
                    class="form-control"
                    name="usuario"
                    required
                    id="nombreLogin"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    name="password"
                    required
                    id="contraseñaLogin"
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100"
                  id="logButton"
                >
                  Entrar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="container mt-4 text-center" id="avisosDOM"></section>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
              <h2 class="card-title fw-bold text-center mb-4">
                Danos tu opinión
              </h2>

              <form id="opinionForm">
                <div class="mb-3">
                  <label for="nombreInput" class="form-label fw-medium"
                    >Nombre completo</label
                  >
                  <input type="text" class="form-control" id="nombreInput" />
                </div>

                <div class="mb-3">
                  <label for="opinionInput" class="form-label fw-medium"
                    >Opinión sobre el servicio</label
                  >
                  <textarea
                    class="form-control"
                    id="opinionInput"
                    rows="3"
                  ></textarea>
                </div>

                <fieldset class="mb-3">
                  <legend class="col-form-label pt-0 fw-medium">
                    Valoración
                  </legend>
                  <div class="form-check mb-1">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="valoracion"
                      id="radioPerfecta"
                      value="perfecta"
                      checked
                    />
                    <label class="form-check-label" for="radioPerfecta"
                      >Página perfecta</label
                    >
                  </div>
                  <div class="form-check mb-1">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="valoracion"
                      id="radioBuena"
                      value="buena"
                    />
                    <label class="form-check-label" for="radioBuena"
                      >Buena página</label
                    >
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="valoracion"
                      id="radioMejorable"
                      value="mejorable"
                    />
                    <label class="form-check-label" for="radioMejorable"
                      >Página mejorable</label
                    >
                  </div>
                </fieldset>

                <div class="mb-4">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="politicasCheck"
                    />
                    <label
                      class="form-check-label small text-muted"
                      for="politicasCheck"
                    >
                      Acepto las políticas de procesamiento de datos
                    </label>
                  </div>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-semibold"
                >
                  Enviar datos
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./../js/login.js"></script>
    <script type="module" src="./../js/contacto.js"></script>
  </body>
</html>
