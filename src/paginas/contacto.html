<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina de contacto</title>
  <link rel="icon" type="image/svg+xml" href="./../public/img/pc-store-icon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="./../style/style.css" type="text/css" />
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="./../index.html"><img
            src="./../public/img/pc-store-icon.svg" alt="" width="36" height="36" /><span class="logo-texto"><span
              class="logo-pc">PC</span>
            <span class="fw-medium text-primary">Store</span></span></a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavegacion">
          <ul class="navbar-nav align-items-lg-center gap-lg-2 me-auto">
            <li class="nav-item">
              <a class="nav-link" href="./tienda.html">Tienda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active fw-semibold" href="./contacto.html">Contacto</a>
            </li>
          </ul>

          <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 py-2 py-lg-0">
            <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#RegModal"
              id="botonRegistroLogin">
              Registrarse / Login
            </button>

            <div id="tipoUsuario"></div>
            <div id="bienvenidaHeader"></div>

            <button type="button" class="btn btn-outline-danger d-none" id="cerrarSesionBoton">
              Cerrar sesion
            </button>

            <button class="btn btn-outline-primary d-none" id="mostrarPanelAdmin" data-bs-toggle="modal"
              data-bs-target="#modalAdmin">
              Panel Admin
            </button>

            <button class="btn btn-outline-danger d-none" id="mostrarEliminarProducto" data-bs-toggle="modal"
              data-bs-target="#modalEliminarProducto">
              Eliminar producto
            </button>

            <button class="btn btn-primary position-relative d-none" id="botonBolsa" data-bs-toggle="modal"
              data-bs-target="#modalBolsa">
              Bolsa
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                id="badgeBolsa">
                0
              </span>
            </button>
            <button class="btn btn-outline-primary d-none ms-2" id="botonEditarPerfil" data-bs-toggle="modal"
              data-bs-target="#contenedorEditarPerfil">
              Editar perfil
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <section class="contenedor-login">
    <div class="modal fade" id="RegModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Registrarse</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <div class="modal-body">
            <ul class="nav nav-pills justify-content-center mb-4">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Registrarse</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Iniciar Sesion</a>
              </li>
            </ul>
            <div id="alertContainer"></div>
            <form id="regForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" name="usuario" required id="nombreInput" />
              </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" name="password" required id="contraseñaInput" />
              </div>
              <button type="submit" class="btn btn-primary w-100" id="regButton">
                Crear cuenta
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Iniciar Sesión</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <div class="modal-body">
            <ul class="nav nav-pills justify-content-center mb-4">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="#" data-bs-toggle="modal"
                  data-bs-target="#RegModal">Registrarse</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="modal" data-bs-target="#loginModal">Iniciar Sesion</a>
              </li>
            </ul>
            <div id="alertContainerLogin"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" name="usuario" required id="nombreLogin" />
              </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" name="password" required id="contraseñaLogin" />
              </div>
              <button type="submit" class="btn btn-primary w-100" id="logButton">
                Entrar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="container mt-4 text-center" id="avisosDOM"></section>

  <section>
    <div class="modal fade" id="tablaProducto" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalProductoTitulo">
              Cargando...
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body p-4">
            <div class="row align-items-center">
              <div class="col-md-5 text-center mb-3 mb-md-0">
                <img src="" id="modalProductoImagen" class="img-fluid rounded" alt="Imagen del producto"
                  style="max-height: 250px; object-fit: contain" />
              </div>
              <div class="col-md-7">
                <div id="avisosModal"></div>
                <p id="modalProductoPrecio" class="fs-3 fw-bold text-primary mb-2"></p>
                <p id="modalProductoDesc" class="text-muted"></p>
                <div class="mb-3">
                  <span class="badge bg-primary fs-6 fw-normal">Stock disponible:
                    <strong id="modalProductoStock">0</strong></span>
                </div>
                <div class="mb-3">
                  <label for="cantidadProducto" class="form-label fw-medium">Cantidad:</label>
                  <input type="number" class="form-control" id="cantidadProducto" min="1" value="1" />
                </div>
                <div class="d-flex justify-content-center justify-content-md-end mt-4">
                  <button class="btn btn-primary fw-semibold" id="btnAgregarBolsa">
                    Añadir al carrito
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalAdmin" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Panel Admin</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <div class="modal-body p-4">
            <form id="ProductoForm">
              <div class="mb-3">
                <label for="nombreProducto" class="form-label fw-medium">Nombre producto</label>
                <input type="text" class="form-control" id="nombreProducto" required />
              </div>
              <div class="mb-3">
                <label for="ImagenProducto" class="form-label fw-medium">URL de la imagen</label>
                <input type="text" class="form-control" id="ImagenProducto" required />
              </div>
              <div class="mb-3">
                <label for="stockProducto" class="form-label fw-medium">Stock del producto</label>
                <input type="number" class="form-control" id="stockProducto" required />
              </div>

              <div class="mb-3">
                <label for="precioProducto" class="form-label fw-medium">Precio del producto</label>
                <input type="number" class="form-control" id="precioProducto" min="0" step="0.01" required />
              </div>

              <div class="mb-3">
                <label for="DescripcionProducto" class="form-label fw-medium">Descripción producto</label>
                <textarea class="form-control" id="DescripcionProducto" rows="3" required></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Crear producto
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalEliminarProducto" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Eliminar producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <div class="modal-body p-4">
            <label for="selectEliminarProducto" class="form-label fw-medium">Producto</label>
            <select class="form-select mb-3" id="selectEliminarProducto"></select>
            <button type="button" class="btn btn-danger w-100 py-2 fw-semibold" id="btnEliminarProducto">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalBolsa" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Tu Bolsa de la Compra</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body p-4">
            <div id="contenedorBolsa" class="list-group list-group-flush mb-3"
              style="max-height: 50vh; overflow-y: auto"></div>

            <div class="border-top pt-3">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fs-5 text-muted">Total</span>
                <span class="fs-3 fw-bold text-primary" id="totalBolsa">0,00 €</span>
              </div>
              <div class="d-grid d-sm-flex gap-2 justify-content-sm-between">
                <button type="button" class="btn btn-outline-danger" id="btnEliminarBolsa">
                  Eliminar bolsa
                </button>
                <button type="button" class="btn btn-primary fw-semibold px-4" id="btnPagarAhora">
                  Pagar ahora
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="contenedorEditarPerfil" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Editar perfil</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body p-4">
            <div id="avisosEditarPerfil"> </div>
            <form id="editarPerfilForm" novalidate>
              <div class="mb-3">
                <label for="perfilUsuario" class="form-label fw-medium">Nombre de usuario</label>
                <input type="text" class="form-control" id="perfilUsuario" name="usuario" required />
              </div>
              <div class="mb-3">
                <label for="perfilUsuario" class="form-label fw-medium">Contraseña</label>
                <input type="password" class="form-control" id="perfilContraseña" name="contraseña" required />
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-semibold">
                Guardar cambios
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card rounded-3">
          <div class="card-body p-4">
            <h2 class="card-title fw-bold text-center mb-4">
              Danos tu opinión
            </h2>

            <form id="opinionForm">
              <div class="mb-3">
                <label for="nombreOpinion" class="form-label fw-medium">Nombre completo</label>
                <input type="text" class="form-control" id="nombreOpinion" />
              </div>

              <div class="mb-3">
                <label for="opinionInput" class="form-label fw-medium">Opinión sobre el servicio</label>
                <textarea class="form-control" id="opinionInput" rows="3"></textarea>
              </div>

              <fieldset class="mb-3">
                <legend class="col-form-label pt-0 fw-medium">
                  Valoración
                </legend>
                <div class="form-check mb-1">
                  <input class="form-check-input" type="radio" name="valoracion" id="radioPerfecta" value="perfecta"
                    checked />
                  <label class="form-check-label" for="radioPerfecta">Página perfecta</label>
                </div>
                <div class="form-check mb-1">
                  <input class="form-check-input" type="radio" name="valoracion" id="radioBuena" value="buena" />
                  <label class="form-check-label" for="radioBuena">Buena página</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="valoracion" id="radioMejorable"
                    value="mejorable" />
                  <label class="form-check-label" for="radioMejorable">Página mejorable</label>
                </div>
              </fieldset>

              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="politicasCheck" />
                  <label class="form-check-label small text-muted" for="politicasCheck">
                    Acepto las políticas de procesamiento de datos
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Enviar datos
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
  <script type="module" src="./../js/login.js"></script>
  <script type="module" src="./../js/insertar-productos.js"></script>
  <script type="module" src="./../js/bolsa.js"></script>
  <script type="module" src="./../js/editar-usuarios.js"></script>
  <script type="module" src="./../js/contacto.js"></script>
</body>

</html>
